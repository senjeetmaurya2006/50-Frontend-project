<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 11/50 — SVG Logo Draw-On Intro</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#0d0e13;
    --bg-2:#06070a;
    --ink:#f1f2f5;
    --muted:#8a8d99;
    --accent-a:#7c5cff;
    --accent-b:#22d3ee;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; min-height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(124,92,255,.16) 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    font-family:'Space Grotesk', sans-serif;
    color:var(--ink);
  }

  .page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: clamp(26px, 5vh, 40px);
    padding: 40px 20px;
  }

  .eyebrow{
    font-size: clamp(10px, 1.6vw, 12px);
    letter-spacing:.32em;
    text-transform:uppercase;
    color: var(--muted);
    opacity:0;
    animation: fadeUp .6s ease forwards;
  }

  .mark-wrap{
    position:relative;
    width: clamp(140px, 24vw, 190px);
    height: clamp(140px, 24vw, 190px);
    cursor:pointer;
  }

  .mark-wrap svg{ width:100%; height:100%; overflow:visible; }

  .ring{
    fill: rgba(124,92,255,0);
    stroke: url(#strokeGrad);
    stroke-width: 3.2;
    transition: fill 1s ease .1s;
  }

  .bolt{
    fill: rgba(124,92,255,0);
    stroke: url(#strokeGrad);
    stroke-width: 3.4;
    stroke-linejoin: round;
    stroke-linecap: round;
    transition: fill .9s ease .1s;
  }

  .mark-wrap.filled .ring{ fill: url(#fillGrad); fill-opacity:.14; }
  .mark-wrap.filled .bolt{ fill: url(#fillGrad); }

  .glow-pulse{
    position:absolute; inset:-20%;
    border-radius:50%;
    background: radial-gradient(circle, rgba(124,92,255,.35), transparent 65%);
    opacity:0;
    pointer-events:none;
  }

  .mark-wrap.filled .glow-pulse{
    animation: pulseOut 1s ease-out .15s;
  }

  @keyframes pulseOut{
    0%{ opacity:.9; transform:scale(.4); }
    100%{ opacity:0; transform:scale(1.3); }
  }

  .wordmark{
    display:flex;
    gap: 2px;
    font-size: clamp(30px, 6vw, 46px);
    font-weight:700;
    letter-spacing:.06em;
  }

  .wordmark span{
    display:inline-block;
    opacity:0;
    transform: translateY(16px);
    background: linear-gradient(90deg, #fff, #c6c9ff);
    -webkit-background-clip:text;
    background-clip:text;
    color:transparent;
  }

  .wordmark span.show{
    animation: letterUp .55s cubic-bezier(.2,.8,.2,1) forwards;
  }

  @keyframes letterUp{
    to{ opacity:1; transform:translateY(0); }
  }

  .tagline{
    font-size: clamp(12px, 2vw, 13.5px);
    letter-spacing:.24em;
    text-transform:uppercase;
    color: var(--muted);
    opacity:0;
    transition: opacity .8s ease;
  }
  .tagline.show{ opacity:1; }

  .hint{
    margin-top:6px;
    font-size:11.5px;
    color: var(--muted);
    letter-spacing:.05em;
    display:flex;
    align-items:center;
    gap:8px;
    opacity:0;
    animation: fadeUp .6s ease 2.6s forwards;
  }
  .hint .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--accent-b);
    box-shadow: 0 0 8px 2px var(--accent-b);
    animation: dotPulse 1.5s ease-in-out infinite;
  }
  @keyframes dotPulse{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(1.5); opacity:.5; }
  }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(14px); }
    to{ opacity:1; transform:translateY(0); }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001s !important; transition-duration:.05s !important; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="eyebrow">Day 11 / 50 — SVG Logo Draw-On</div>

  <div class="mark-wrap" id="markWrap">
    <div class="glow-pulse"></div>
    <svg viewBox="0 0 200 200">
      <defs>
        <linearGradient id="strokeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#7c5cff"></stop>
          <stop offset="100%" stop-color="#22d3ee"></stop>
        </linearGradient>
        <linearGradient id="fillGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#7c5cff"></stop>
          <stop offset="100%" stop-color="#22d3ee"></stop>
        </linearGradient>
      </defs>
      <circle class="ring" id="ring" cx="100" cy="100" r="90"></circle>
      <path class="bolt" id="bolt" d="M116.3,16.7 L41.3,116.7 L91.3,116.7 L83.0,183.3 L158.0,83.3 L108.0,83.3 Z"></path>
    </svg>
  </div>

  <div class="wordmark" id="wordmark">
    <span>L</span><span>U</span><span>M</span><span>E</span><span>N</span>
  </div>
  <div class="tagline" id="tagline">Digital Craft Studio</div>

  <div class="hint"><span class="dot"></span> Click the mark to replay</div>
</div>

<script>
(function(){
  const markWrap = document.getElementById('markWrap');
  const ring = document.getElementById('ring');
  const bolt = document.getElementById('bolt');
  const wordmark = document.getElementById('wordmark');
  const tagline = document.getElementById('tagline');
  const letters = Array.from(wordmark.querySelectorAll('span'));
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  const RING_DURATION = 1100;
  const BOLT_DELAY = 650;
  const BOLT_DURATION = 900;

  function prepareStroke(el){
    const len = el.getTotalLength();
    el.style.transition = 'none';
    el.style.strokeDasharray = len;
    el.style.strokeDashoffset = len;
    return len;
  }

  function drawStroke(el, duration){
    el.style.transition = `stroke-dashoffset ${duration}ms cubic-bezier(.3,.6,.2,1)`;
    el.style.strokeDashoffset = '0';
  }

  let timers = [];
  function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

  function playSequence(){
    clearTimers();
    markWrap.classList.remove('filled');
    tagline.classList.remove('show');
    letters.forEach((l) => { l.classList.remove('show'); l.style.transitionDelay = ''; });

    prepareStroke(ring);
    prepareStroke(bolt);

    if (reduceMotion){
      ring.style.strokeDashoffset = '0';
      bolt.style.strokeDashoffset = '0';
      markWrap.classList.add('filled');
      letters.forEach((l) => l.classList.add('show'));
      tagline.classList.add('show');
      return;
    }

    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        drawStroke(ring, RING_DURATION);
        timers.push(setTimeout(() => drawStroke(bolt, BOLT_DURATION), BOLT_DELAY));

        const fillAt = BOLT_DELAY + BOLT_DURATION + 80;
        timers.push(setTimeout(() => markWrap.classList.add('filled'), fillAt));

        letters.forEach((l, i) => {
          timers.push(setTimeout(() => l.classList.add('show'), fillAt + 260 + i * 90));
        });

        timers.push(setTimeout(() => tagline.classList.add('show'), fillAt + 260 + letters.length * 90 + 150));
      });
    });
  }

  markWrap.addEventListener('click', playSequence);
  window.addEventListener('load', playSequence);
})();
</script>

</body>
</html>
