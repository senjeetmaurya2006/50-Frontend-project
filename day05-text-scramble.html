<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 05/50 — Text Scramble Reveal</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#0a0c0f;
    --bg-2:#050607;
    --term-bg:#0b0f11;
    --ink:#dbe6e0;
    --muted:#5f7268;
    --accent:#39ffa8;
    --accent-2:#4dd8ff;
    --border: rgba(57,255,168,.18);
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; min-height:100%;
    background:
      radial-gradient(ellipse at 50% -10%, rgba(57,255,168,.08) 0%, transparent 55%),
      linear-gradient(180deg, var(--bg-1) 0%, var(--bg-2) 100%);
    font-family:'JetBrains Mono', monospace;
    color:var(--ink);
  }

  .page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    padding: 40px 18px;
  }

  .eyebrow{
    font-size: clamp(10px, 1.6vw, 12px);
    letter-spacing:.32em;
    text-transform:uppercase;
    color: var(--muted);
    margin-bottom: 22px;
    opacity:0;
    animation: fadeUp .6s ease forwards;
  }

  .terminal{
    position:relative;
    width:min(94vw, 640px);
    background: var(--term-bg);
    border: 1px solid var(--border);
    border-radius: 14px;
    box-shadow: 0 30px 80px -20px rgba(0,0,0,.75), 0 0 60px -20px rgba(57,255,168,.15);
    overflow:hidden;
    opacity:0;
    transform: translateY(16px);
    animation: fadeUp .7s ease .1s forwards;
  }

  .terminal::after{
    content:"";
    position:absolute; inset:0;
    background: repeating-linear-gradient(
      0deg, rgba(255,255,255,.025) 0px, rgba(255,255,255,.025) 1px,
      transparent 1px, transparent 3px
    );
    pointer-events:none;
    mix-blend-mode: overlay;
  }

  .term-bar{
    display:flex;
    align-items:center;
    gap:16px;
    padding: 13px 16px;
    background: rgba(255,255,255,.02);
    border-bottom: 1px solid rgba(255,255,255,.06);
  }

  .dots{ display:flex; gap:8px; }
  .tdot{ width:11px; height:11px; border-radius:50%; }
  .tdot.r{ background:#ff5f57; }
  .tdot.a{ background:#febc2e; }
  .tdot.g{ background:#28c840; }

  .term-path{
    font-size:11.5px;
    color: var(--muted);
    letter-spacing:.02em;
  }

  .term-body{
    padding: clamp(28px, 6vw, 48px) clamp(20px, 6vw, 42px) clamp(34px, 7vw, 52px);
  }

  .headline{
    font-size: clamp(26px, 6.2vw, 44px);
    font-weight:800;
    letter-spacing:.01em;
    line-height:1.15;
    margin:0 0 8px;
    min-height: 1.3em;
    cursor: default;
  }

  .headline .scramble-glyph{
    color: var(--accent);
    text-shadow: 0 0 10px rgba(57,255,168,.75);
  }

  .headline-hint{
    font-size:11.5px;
    color: var(--muted);
    letter-spacing:.06em;
    margin: 0 0 34px;
  }

  .lines{
    display:flex;
    flex-direction:column;
    gap: 16px;
  }

  .line{
    display:flex;
    align-items:baseline;
    gap:10px;
    font-size: clamp(13px, 2.6vw, 15px);
    padding: 4px 0;
    cursor:pointer;
  }

  .line .prompt{ color: var(--accent-2); flex-shrink:0; }

  .line .text{
    color: var(--ink);
    letter-spacing:.01em;
  }

  .line .text .scramble-glyph{
    color: var(--accent);
    text-shadow: 0 0 8px rgba(57,255,168,.7);
  }

  .cursor-block{
    display:inline-block;
    width:9px; height:1em;
    background: var(--accent);
    margin-left:6px;
    vertical-align:-2px;
    animation: blink 1s steps(1) infinite;
    box-shadow: 0 0 8px rgba(57,255,168,.8);
  }

  @keyframes blink{ 50%{ opacity:0; } }

  @keyframes fadeUp{
    from{ opacity:0; transform:translateY(16px); }
    to{ opacity:1; transform:translateY(0); }
  }

  .footer-hint{
    margin-top:22px;
    font-size:11.5px;
    color: var(--muted);
    letter-spacing:.05em;
    display:flex;
    align-items:center;
    gap:8px;
    opacity:0;
    animation: fadeUp .6s ease .5s forwards;
  }

  .footer-hint .dot{
    width:6px; height:6px; border-radius:50%;
    background: var(--accent);
    box-shadow: 0 0 8px 2px var(--accent);
    animation: dotPulse 1.5s ease-in-out infinite;
  }

  @keyframes dotPulse{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(1.5); opacity:.5; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001s !important; transition-duration:.05s !important; }
  }
</style>
</head>
<body>

<div class="page">
  <div class="eyebrow">Day 05 / 50 — Text Scramble Reveal</div>

  <div class="terminal">
    <div class="term-bar">
      <div class="dots">
        <span class="tdot r"></span><span class="tdot a"></span><span class="tdot g"></span>
      </div>
      <div class="term-path">root@frontend:~$ ./decrypt.sh</div>
    </div>

    <div class="term-body">
      <h1 class="headline" id="mainHeadline"></h1>
      <p class="headline-hint">auto-decrypted on load — hover the lines below to replay</p>

      <div class="lines">
        <div class="line" data-text="IDENTITY: FRONTEND DEVELOPER">
          <span class="prompt">&gt;</span><span class="text"></span>
        </div>
        <div class="line" data-text="STATUS: ONLINE">
          <span class="prompt">&gt;</span><span class="text"></span>
        </div>
        <div class="line" data-text="MISSION: 50 PROJECTS IN 50 DAYS">
          <span class="prompt">&gt;</span><span class="text"></span><span class="cursor-block"></span>
        </div>
      </div>
    </div>
  </div>

  <div class="footer-hint"><span class="dot"></span> Hover any line to re-scramble it</div>
</div>

<script>
(function(){
  const CHARS = "!<>-_\\/[]{}—=+*^?#$%&ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function randomChar(){
    return CHARS[Math.floor(Math.random() * CHARS.length)];
  }

  class TextScramble{
    constructor(el){
      this.el = el;
      this.frame = 0;
      this.queue = [];
      this.frameRequest = null;
      this.resolve = null;
    }
    setText(newText){
      const oldText = this.el.textContent;
      const length = Math.max(oldText.length, newText.length);
      const promise = new Promise((resolve) => { this.resolve = resolve; });
      this.queue = [];
      for (let i = 0; i < length; i++){
        const from = oldText[i] || '';
        const to = newText[i] || '';
        const start = Math.floor(Math.random() * 30);
        const end = start + Math.floor(Math.random() * 30) + 14;
        this.queue.push({ from, to, start, end, char: null });
      }
      cancelAnimationFrame(this.frameRequest);
      this.frame = 0;
      if (reduceMotion){
        this.el.textContent = newText;
        this.resolve();
        return promise;
      }
      this._update();
      return promise;
    }
    _update(){
      let output = '';
      let complete = 0;
      for (let i = 0; i < this.queue.length; i++){
        let { from, to, start, end, char } = this.queue[i];
        if (this.frame >= end){
          complete++;
          output += to;
        } else if (this.frame >= start){
          if (!char || Math.random() < 0.3){
            char = randomChar();
            this.queue[i].char = char;
          }
          output += `<span class="scramble-glyph">${char}</span>`;
        } else {
          output += from;
        }
      }
      this.el.innerHTML = output;
      if (complete === this.queue.length){
        this.resolve();
      } else {
        this.frameRequest = requestAnimationFrame(() => this._update());
        this.frame++;
      }
    }
  }

  // main headline
  const mainEl = document.getElementById('mainHeadline');
  const mainFx = new TextScramble(mainEl);
  window.addEventListener('load', () => {
    setTimeout(() => mainFx.setText('HOVER TO DECRYPT'), 350);
  });
  mainEl.addEventListener('mouseenter', () => mainFx.setText('HOVER TO DECRYPT'));

  // secondary lines
  document.querySelectorAll('.line').forEach((line) => {
    const textEl = line.querySelector('.text');
    const fx = new TextScramble(textEl);
    const finalText = line.dataset.text;
    let played = false;

    function play(){
      fx.setText(finalText);
    }

    line.addEventListener('mouseenter', play);

    // stagger the initial reveal of each line after the headline resolves
    const delay = 900 + Array.from(line.parentElement.children).indexOf(line) * 260;
    setTimeout(() => { if (!played){ played = true; play(); } }, delay);
  });
})();
</script>

</body>
</html>
