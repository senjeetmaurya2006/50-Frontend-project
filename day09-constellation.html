<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 09/50 — Interactive Constellation Network</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg-1:#0a0e1a;
    --bg-2:#04050a;
    --ink:#eef0f6;
    --muted:#7d8296;
  }
  *{ box-sizing:border-box; }
  html,body{
    height:100%; margin:0; overflow:hidden;
    background: radial-gradient(circle at 50% 25%, var(--bg-1) 0%, var(--bg-2) 75%);
    font-family:'Space Grotesk', sans-serif;
    color:var(--muted);
  }

  canvas{ position:fixed; inset:0; display:block; }

  .nebula{
    position:fixed; inset:0;
    pointer-events:none;
    background:
      radial-gradient(circle at 20% 25%, rgba(124,92,255,.10) 0%, transparent 32%),
      radial-gradient(circle at 82% 70%, rgba(34,211,238,.08) 0%, transparent 30%),
      radial-gradient(circle at 55% 90%, rgba(255,60,172,.06) 0%, transparent 28%);
  }

  .eyebrow{
    position:fixed;
    top: clamp(16px, 3vh, 28px);
    left:50%;
    transform:translateX(-50%);
    font-size: clamp(10px, 1.6vw, 12px);
    letter-spacing:.3em;
    text-transform:uppercase;
    color: var(--muted);
    opacity:.75;
    z-index:5;
    pointer-events:none;
  }

  .hint{
    position:fixed;
    bottom: clamp(18px, 4vh, 32px);
    left:50%;
    transform:translateX(-50%);
    font-size: clamp(11px, 1.8vw, 13px);
    letter-spacing:.06em;
    color: var(--ink);
    opacity:.85;
    z-index:5;
    display:flex;
    align-items:center;
    gap:8px;
    text-align:center;
    transition: opacity .6s ease;
    pointer-events:none;
  }

  .hint .dot{
    width:6px; height:6px; border-radius:50%;
    background:#9fc4ff;
    box-shadow: 0 0 8px 2px #9fc4ff;
    animation: dotPulse 1.5s ease-in-out infinite;
    flex-shrink:0;
  }

  @keyframes dotPulse{
    0%,100%{ transform:scale(1); opacity:1; }
    50%{ transform:scale(1.5); opacity:.5; }
  }
</style>
</head>
<body>

<div class="nebula"></div>
<div class="eyebrow">Day 09 / 50 — Constellation Network</div>
<canvas id="stage"></canvas>
<div class="hint" id="hint"><span class="dot"></span> Move to join the network · click for a shockwave</div>

<script>
(function(){
  const canvas = document.getElementById('stage');
  const ctx = canvas.getContext('2d');
  const hint = document.getElementById('hint');
  const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  let W, H, DPR;
  function resize(){
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR,0,0,DPR,0,0);
  }
  resize();
  window.addEventListener('resize', resize);

  // ---------- nodes ----------
  const NODE_COUNT = Math.min(Math.floor((W * H) / 14000), 130);
  const LINK_DIST = 128;
  const MOUSE_LINK_DIST = 190;
  const MOUSE_REPEL_DIST = 110;

  const nodes = [];
  function makeNode(){
    const bvx = (Math.random() - 0.5) * 0.18;
    const bvy = (Math.random() - 0.5) * 0.18;
    return {
      x: Math.random() * W,
      y: Math.random() * H,
      vx: bvx, vy: bvy,
      bvx, bvy,
      r: 1.1 + Math.random() * 1.6,
      tint: Math.random() < 0.7 ? 0 : 1, // 0 = white, 1 = pale blue
      phase: Math.random() * Math.PI * 2,
      phaseSpeed: 0.6 + Math.random() * 0.8,
    };
  }
  for (let i = 0; i < NODE_COUNT; i++) nodes.push(makeNode());

  // ---------- mouse ----------
  let mouse = { x: -9999, y: -9999, active: false };
  let hintHidden = false;

  function onPointerMove(x, y){
    mouse.x = x; mouse.y = y; mouse.active = true;
    if (!hintHidden){ hintHidden = true; hint.style.opacity = '0'; }
  }
  window.addEventListener('mousemove', (e) => onPointerMove(e.clientX, e.clientY));
  window.addEventListener('touchmove', (e) => {
    if (e.touches && e.touches[0]) onPointerMove(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive:true });
  window.addEventListener('mouseleave', () => { mouse.active = false; });

  // ---------- click shockwaves ----------
  const shockwaves = [];
  function spawnShockwave(x, y){
    shockwaves.push({ x, y, radius: 0, maxRadius: Math.max(W, H) * 0.6, speed: 7.5 });
  }
  window.addEventListener('mousedown', (e) => spawnShockwave(e.clientX, e.clientY));
  window.addEventListener('touchstart', (e) => {
    if (e.touches && e.touches[0]) spawnShockwave(e.touches[0].clientX, e.touches[0].clientY);
  }, { passive:true });

  // ---------- shooting stars ----------
  let shootingStar = null;
  function scheduleShootingStar(){
    const delay = 7000 + Math.random() * 9000;
    setTimeout(() => {
      const fromLeft = Math.random() < 0.5;
      const startX = fromLeft ? -40 : W + 40;
      const startY = Math.random() * H * 0.5;
      const angle = fromLeft ? (Math.PI/8 + Math.random()*0.2) : (Math.PI - Math.PI/8 - Math.random()*0.2);
      const speed = 9 + Math.random() * 4;
      shootingStar = {
        x: startX, y: startY,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        life: 1,
        trail: [],
      };
      scheduleShootingStar();
    }, delay);
  }
  if (!reduceMotion) scheduleShootingStar();

  // ---------- update ----------
  function update(dt){
    for (const n of nodes){
      // restoring pull toward base wander velocity
      n.vx += (n.bvx - n.vx) * 0.02;
      n.vy += (n.bvy - n.vy) * 0.02;

      if (mouse.active){
        const dx = n.x - mouse.x, dy = n.y - mouse.y;
        const dist = Math.hypot(dx, dy);
        if (dist < MOUSE_REPEL_DIST && dist > 0.001){
          const force = (1 - dist / MOUSE_REPEL_DIST) * 0.9;
          n.vx += (dx / dist) * force;
          n.vy += (dy / dist) * force;
        }
      }

      for (const sw of shockwaves){
        const dx = n.x - sw.x, dy = n.y - sw.y;
        const dist = Math.hypot(dx, dy);
        if (Math.abs(dist - sw.radius) < 18 && dist > 0.001){
          const force = 1.6;
          n.vx += (dx / dist) * force;
          n.vy += (dy / dist) * force;
        }
      }

      n.vx *= 0.94; n.vy *= 0.94;
      n.x += n.vx * dt;
      n.y += n.vy * dt;

      if (n.x < -20) n.x = W + 20; else if (n.x > W + 20) n.x = -20;
      if (n.y < -20) n.y = H + 20; else if (n.y > H + 20) n.y = -20;
    }

    for (let i = shockwaves.length - 1; i >= 0; i--){
      shockwaves[i].radius += shockwaves[i].speed * dt;
      if (shockwaves[i].radius > shockwaves[i].maxRadius) shockwaves.splice(i, 1);
    }

    if (shootingStar){
      shootingStar.trail.push({ x: shootingStar.x, y: shootingStar.y });
      if (shootingStar.trail.length > 18) shootingStar.trail.shift();
      shootingStar.x += shootingStar.vx * dt;
      shootingStar.y += shootingStar.vy * dt;
      if (shootingStar.x < -60 || shootingStar.x > W + 60 || shootingStar.y > H + 60){
        shootingStar = null;
      }
    }
  }

  // ---------- draw ----------
  function draw(now){
    ctx.clearRect(0, 0, W, H);

    // connections between nearby nodes
    for (let i = 0; i < nodes.length; i++){
      for (let j = i + 1; j < nodes.length; j++){
        const a = nodes[i], b = nodes[j];
        const dx = a.x - b.x, dy = a.y - b.y;
        const dist = Math.hypot(dx, dy);
        if (dist < LINK_DIST){
          const alpha = (1 - dist / LINK_DIST) * 0.5;
          ctx.strokeStyle = `rgba(140,165,255,${alpha})`;
          ctx.lineWidth = 1;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }

    // mouse connections
    if (mouse.active){
      for (const n of nodes){
        const dx = n.x - mouse.x, dy = n.y - mouse.y;
        const dist = Math.hypot(dx, dy);
        if (dist < MOUSE_LINK_DIST){
          const alpha = (1 - dist / MOUSE_LINK_DIST) * 0.85;
          ctx.strokeStyle = `rgba(190,225,255,${alpha})`;
          ctx.lineWidth = 1.2;
          ctx.beginPath();
          ctx.moveTo(mouse.x, mouse.y);
          ctx.lineTo(n.x, n.y);
          ctx.stroke();
        }
      }
      ctx.beginPath();
      ctx.fillStyle = 'rgba(255,255,255,0.95)';
      ctx.shadowColor = 'rgba(190,225,255,0.9)';
      ctx.shadowBlur = 14;
      ctx.arc(mouse.x, mouse.y, 3.4, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }

    // nodes with twinkle
    for (const n of nodes){
      const twinkle = 0.55 + 0.45 * Math.sin(now/1000 * n.phaseSpeed + n.phase);
      const color = n.tint ? `rgba(170,200,255,${twinkle})` : `rgba(255,255,255,${twinkle})`;
      ctx.beginPath();
      ctx.fillStyle = color;
      ctx.shadowColor = 'rgba(160,190,255,0.6)';
      ctx.shadowBlur = 4;
      ctx.arc(n.x, n.y, n.r, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.shadowBlur = 0;

    // shockwave rings
    for (const sw of shockwaves){
      const alpha = Math.max(1 - sw.radius / sw.maxRadius, 0) * 0.5;
      ctx.beginPath();
      ctx.strokeStyle = `rgba(150,180,255,${alpha})`;
      ctx.lineWidth = 1.4;
      ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI*2);
      ctx.stroke();
    }

    // shooting star
    if (shootingStar){
      const trail = shootingStar.trail;
      for (let i = 0; i < trail.length - 1; i++){
        const a = i / trail.length;
        ctx.beginPath();
        ctx.strokeStyle = `rgba(255,255,255,${a * 0.7})`;
        ctx.lineWidth = 1.6 * a;
        ctx.moveTo(trail[i].x, trail[i].y);
        ctx.lineTo(trail[i+1].x, trail[i+1].y);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.fillStyle = '#ffffff';
      ctx.shadowColor = 'rgba(255,255,255,0.9)';
      ctx.shadowBlur = 12;
      ctx.arc(shootingStar.x, shootingStar.y, 1.8, 0, Math.PI*2);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  let lastFrame = performance.now();
  function frame(now){
    const dt = reduceMotion ? 1 : Math.min((now - lastFrame) / 16.7, 2.4);
    lastFrame = now;
    update(dt);
    draw(now);
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>

</body>
</html>
