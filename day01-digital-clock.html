<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Day 01/50 — Flip Clock</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700;800&family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#14151a;
    --bg-2:#0b0c10;
    --card:#f1ede4;
    --card-shade:#dcd6c9;
    --ink:#1b1b1d;
    --crease: rgba(0,0,0,.32);
    --accent:#ff6b35;
    --muted:#8a8d93;
    --ring: rgba(255,255,255,.08);
  }

  *{ box-sizing:border-box; }

  html,body{
    height:100%;
    margin:0;
    background:
      radial-gradient(circle at 50% 18%, #1d1e25 0%, var(--bg) 55%, var(--bg-2) 100%);
    font-family:'Space Grotesk', sans-serif;
    color:var(--muted);
    overflow:hidden;
  }

  .stage{
    min-height:100vh;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap: clamp(18px, 3vh, 32px);
    padding: 24px;
  }

  .eyebrow{
    font-size: clamp(11px, 1.6vw, 13px);
    letter-spacing: .32em;
    text-transform: uppercase;
    color: var(--muted);
    opacity: 0;
    animation: fadeUp .7s ease .05s forwards;
  }

  .analog-wrap{
    opacity: 0;
    transform: scale(.86);
    animation: popIn .8s cubic-bezier(.2,.8,.2,1) .18s forwards;
  }

  .analog{
    width: clamp(96px, 16vw, 140px);
    height: auto;
    display:block;
  }

  .face{ fill:none; stroke:var(--ring); stroke-width:1.5; }
  .tick{ stroke:var(--muted); stroke-width:1.5; opacity:.55; }
  .tick.major{ stroke:#e7e4db; opacity:.9; stroke-width:2.5; }
  .hand{ stroke-linecap:round; }
  .hand-hour{ stroke:#e7e4db; stroke-width:4; }
  .hand-min{ stroke:#e7e4db; stroke-width:3; }
  .hand-sec{ stroke:var(--accent); stroke-width:1.6; }
  .pin{ fill:var(--accent); }

  .board{
    display:flex;
    align-items:center;
    gap: clamp(6px, 1.4vw, 14px);
  }

  .pair{ display:flex; gap: clamp(4px, 1vw, 8px); }

  .colon{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size: clamp(24px, 5vw, 44px);
    color: var(--card);
    line-height:1;
    padding-bottom: 4px;
    animation: blink 1s steps(1) infinite;
    opacity:0;
    animation: fadeIn .3s ease .9s forwards, blink 1s steps(1) 1.1s infinite;
  }

  :root{
    --digit-h: clamp(72px, 13.5vw, 126px);
    --digit-fs: clamp(38px, 7.4vw, 68px);
  }

  .flip-unit{
    position:relative;
    width: clamp(48px, 9vw, 84px);
    height: var(--digit-h);
    border-radius: 8px;
    opacity: 0;
    transform: translateY(10px);
    animation: fadeUp .5s ease forwards;
    filter: drop-shadow(0 10px 18px rgba(0,0,0,.45));
  }

  .digit, .flip-panel{
    position:absolute;
    left:0;
    width:100%;
    height:50%;
    overflow:hidden;
    background: var(--card);
  }

  .digit span, .flip-panel span{
    position:absolute;
    left:0;
    width:100%;
    height: var(--digit-h);
    line-height: var(--digit-h);
    text-align:center;
    font-family:'JetBrains Mono', monospace;
    font-weight:800;
    font-size: var(--digit-fs);
    color: var(--ink);
    -webkit-font-smoothing:antialiased;
  }

  .digit.top{ top:0; border-radius:8px 8px 0 0; }
  .digit.top span{ top:0; }

  .digit.bottom{ top:50%; background:var(--card-shade); border-radius:0 0 8px 8px; }
  .digit.bottom span{ top:calc(-1 * var(--digit-h) / 2); }

  .flip-panel{ backface-visibility:hidden; z-index:3; }

  .flip-panel.front{
    top:0;
    border-radius:8px 8px 0 0;
    transform-origin: 50% 100%;
    transform: rotateX(0deg);
    box-shadow: inset 0 -10px 14px -8px var(--crease);
  }
  .flip-panel.front span{ top:0; }

  .flip-panel.back{
    top:50%;
    background:var(--card-shade);
    border-radius:0 0 8px 8px;
    transform-origin: 50% 0%;
    transform: rotateX(90deg);
    z-index:2;
  }
  .flip-panel.back span{ top:calc(-1 * var(--digit-h) / 2); }

  .flip-unit::after{
    content:"";
    position:absolute;
    left:0; right:0; top:50%;
    height:2px;
    background: var(--crease);
    transform: translateY(-1px);
    z-index:4;
    pointer-events:none;
  }

  @keyframes flipFront{ from{ transform: rotateX(0deg);} to{ transform: rotateX(-90deg);} }
  @keyframes flipBack{ from{ transform: rotateX(90deg);} to{ transform: rotateX(0deg);} }
  .anim-front{ animation: flipFront .32s cubic-bezier(.4,0,.2,1) forwards; }
  .anim-back{ animation: flipBack .28s cubic-bezier(.2,0,.4,1) .3s forwards; }

  .meta{
    display:flex;
    align-items:center;
    gap:10px;
    opacity:0;
    animation: fadeIn .6s ease 1.2s forwards;
  }
  .ampm{
    font-family:'JetBrains Mono', monospace;
    font-weight:700;
    font-size: 13px;
    letter-spacing:.12em;
    color: var(--accent);
    border: 1px solid rgba(255,107,53,.4);
    padding: 3px 8px;
    border-radius: 4px;
  }
  .tz{
    font-size: 11px;
    letter-spacing: .28em;
    text-transform: uppercase;
  }

  @keyframes fadeUp{ from{ opacity:0; transform:translateY(10px);} to{ opacity:1; transform:translateY(0);} }
  @keyframes fadeIn{ to{ opacity:1; } }
  @keyframes blink{ 50%{ opacity:.15; } }
  @keyframes popIn{ from{ opacity:0; transform:scale(.86);} to{ opacity:1; transform:scale(1);} }

  @media (prefers-reduced-motion: reduce){
    *{ animation-duration:.001s !important; animation-delay:0s !important; }
  }
</style>
</head>
<body>

<div class="stage">
  <div class="eyebrow">Day 01 / 50 — Digital Clock</div>

  <div class="analog-wrap">
    <svg class="analog" viewBox="0 0 200 200">
      <circle class="face" cx="100" cy="100" r="92"></circle>
      <g id="ticks"></g>
      <line id="hourHand" class="hand hand-hour" x1="100" y1="100" x2="100" y2="60"></line>
      <line id="minHand" class="hand hand-min" x1="100" y1="100" x2="100" y2="45"></line>
      <line id="secHand" class="hand hand-sec" x1="100" y1="112" x2="100" y2="38"></line>
      <circle class="pin" cx="100" cy="100" r="4"></circle>
    </svg>
  </div>

  <div class="board" id="board"></div>

  <div class="meta">
    <span class="ampm" id="ampm">AM</span>
    <span class="tz">Local Time</span>
  </div>
</div>

<script>
(function(){
  const board = document.getElementById('board');
  const keys = ['h1','h2','m1','m2','s1','s2'];
  const units = {};

  function makeUnit(key, delay){
    const unit = document.createElement('div');
    unit.className = 'flip-unit';
    unit.style.animationDelay = delay + 'ms';
    unit.innerHTML = `
      <div class="digit top"><span>0</span></div>
      <div class="digit bottom"><span>0</span></div>
      <div class="flip-panel front"><span>0</span></div>
      <div class="flip-panel back"><span>0</span></div>
    `;
    units[key] = {
      root: unit,
      top: unit.querySelector('.digit.top span'),
      bottom: unit.querySelector('.digit.bottom span'),
      front: unit.querySelector('.flip-panel.front'),
      back: unit.querySelector('.flip-panel.back'),
      frontSpan: unit.querySelector('.flip-panel.front span'),
      backSpan: unit.querySelector('.flip-panel.back span'),
      current: '0'
    };
    return unit;
  }

  ['h1','h2'].forEach((k,i) => board.appendChild(makeUnit(k, i*90)));
  board.appendChild(colon(220));
  ['m1','m2'].forEach((k,i) => board.appendChild(makeUnit(k, 260 + i*90)));
  board.appendChild(colon(480));
  ['s1','s2'].forEach((k,i) => board.appendChild(makeUnit(k, 520 + i*90)));

  function colon(delay){
    const c = document.createElement('div');
    c.className = 'colon';
    c.textContent = ':';
    c.style.animationDelay = delay + 'ms, ' + (delay+200) + 'ms';
    return c;
  }

  function setDigit(key, value, animate){
    const u = units[key];
    if(u.current === value) return;
    if(!animate){
      u.current = value;
      u.top.textContent = value;
      u.bottom.textContent = value;
      u.frontSpan.textContent = value;
      u.backSpan.textContent = value;
      return;
    }
    u.frontSpan.textContent = u.current;
    u.backSpan.textContent = value;
    u.top.textContent = value;
    u.bottom.textContent = value;
    u.current = value;

    u.front.classList.remove('anim-front');
    u.back.classList.remove('anim-back');
    void u.front.offsetWidth;
    u.front.classList.add('anim-front');
    u.back.classList.add('anim-back');
  }

  const ampmEl = document.getElementById('ampm');
  const hourHand = document.getElementById('hourHand');
  const minHand = document.getElementById('minHand');
  const secHand = document.getElementById('secHand');

  // build tick marks
  const ticksG = document.getElementById('ticks');
  for(let i=0;i<60;i++){
    const angle = i*6;
    const major = i % 5 === 0;
    const r1 = major ? 78 : 84;
    const r2 = 90;
    const rad = (angle-90) * Math.PI/180;
    const x1 = 100 + r1*Math.cos(rad), y1 = 100 + r1*Math.sin(rad);
    const x2 = 100 + r2*Math.cos(rad), y2 = 100 + r2*Math.sin(rad);
    const line = document.createElementNS('http://www.w3.org/2000/svg','line');
    line.setAttribute('x1',x1); line.setAttribute('y1',y1);
    line.setAttribute('x2',x2); line.setAttribute('y2',y2);
    line.setAttribute('class', 'tick' + (major ? ' major' : ''));
    ticksG.appendChild(line);
  }

  function tick(first){
    const now = new Date();
    let h = now.getHours();
    const m = now.getMinutes();
    const s = now.getSeconds();
    const isPM = h >= 12;
    ampmEl.textContent = isPM ? 'PM' : 'AM';
    const h12 = h % 12 === 0 ? 12 : h % 12;

    const hh = String(h12).padStart(2,'0');
    const mm = String(m).padStart(2,'0');
    const ss = String(s).padStart(2,'0');

    setDigit('h1', hh[0], !first);
    setDigit('h2', hh[1], !first);
    setDigit('m1', mm[0], !first);
    setDigit('m2', mm[1], !first);
    setDigit('s1', ss[0], !first);
    setDigit('s2', ss[1], !first);

    const hourDeg = (h % 12) * 30 + m * 0.5;
    const minDeg = m * 6 + s * 0.1;
    const secDeg = s * 6;
    hourHand.setAttribute('transform', `rotate(${hourDeg} 100 100)`);
    minHand.setAttribute('transform', `rotate(${minDeg} 100 100)`);
    secHand.setAttribute('transform', `rotate(${secDeg} 100 100)`);
  }

  // initialise all units to a neutral digit first, then flip-in to the real time
  Object.keys(units).forEach(k => setDigit(k, '0', false));

  setTimeout(() => {
    tick(false); // false => animate every digit into place, staggered by each unit's own animation-delay
    setInterval(() => tick(false), 1000);
  }, 650);
})();
</script>

</body>
</html>
